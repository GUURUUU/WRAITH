name: Build liber80211 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android build tools + platform 23 + platform-tools
        run: |
          mkdir -p $HOME/android-sdk
          cd $HOME/android-sdk
          wget -q https://dl.google.com/android/repository/build-tools_r33.0.2-linux.zip -O bt.zip
          unzip -q bt.zip
          wget -q https://dl.google.com/android/repository/platform-tools-latest-linux.zip -O pt.zip
          unzip -q pt.zip
          wget -q https://dl.google.com/android/repository/android-23_r02.zip -O platform.zip
          unzip -o -q platform.zip "android-23/android.jar"
          echo "BT=$HOME/android-sdk/build-tools/33.0.2" >> $GITHUB_ENV
          echo "PT=$HOME/android-sdk/platform-tools" >> $GITHUB_ENV
          ls -la $HOME/android-sdk/build-tools/33.0.2 | head -20
          ls -la $HOME/android-sdk/platforms/android-23/

      - name: Compile resources with aapt2
        run: |
          mkdir -p out/res
          $HOME/android-sdk/build-tools/33.0.2/aapt2 compile --dir res -o out/res
          find out/res -type f

      - name: Link resources + manifest into base APK
        run: |
          $HOME/android-sdk/build-tools/33.0.2/aapt2 link -o base.apk \
            --manifest AndroidManifest.xml \
            -I $HOME/android-sdk/platforms/android-23/android.jar \
            -R $(find out/res -name '*.flat') \
            --java out/gen

      - name: Compile Java sources
        run: |
          mkdir -p out/classes
          javac -source 8 -target 8 -cp "out/gen:$HOME/android-sdk/platforms/android-23/android.jar" -d out/classes src/com/brycestrosoft/liber80211/*.java

      - name: Convert to Dalvik bytecode
        run: |
          $HOME/android-sdk/build-tools/33.0.2/d8 --release --output . out/classes
          ls -la classes.dex

      - name: Add classes.dex to base APK
        run: |
          zip -q base.apk classes.dex

      - name: Align APK
        run: |
          $HOME/android-sdk/platform-tools/zipalign -p 4 base.apk app-aligned.apk

      - name: Create debug keystore and sign APK
        run: |
          keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          $HOME/android-sdk/build-tools/33.0.2/apksigner sign --ks debug.keystore --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out liber80211.apk app-aligned.apk

      - name: Verify APK
        run: |
          $HOME/android-sdk/build-tools/33.0.2/apksigner verify --print-certs liber80211.apk | head -5
          unzip -l liber80211.apk | head -15

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: liber80211-apk
          path: liber80211.apk
          retention-days: 30
