name: Build WRAITH APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Same tools as the documented local build (docs/BUILDING.md).
      - name: Install build tools and platform
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(command -v sdkmanager || find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -1)
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" > /dev/null
          BT="$ANDROID_HOME/build-tools/35.0.0"
          JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$BT/aapt" && test -f "$JAR"
          echo "BT=$BT" >> "$GITHUB_ENV"
          echo "JAR=$JAR" >> "$GITHUB_ENV"

      - name: Compile resources and package the base APK
        run: |
          rm -rf out
          mkdir -p out/gen out/classes
          "$BT/aapt" package -f \
            -M AndroidManifest.xml \
            -S res \
            -I "$JAR" \
            -J out/gen \
            -F out/base.apk
          mkdir -p out/gen/com/brycestrosoft/liber80211
          if [ -f out/gen/R.java ]; then
            mv out/gen/R.java out/gen/com/brycestrosoft/liber80211/R.java
          fi

      - name: Compile Java sources
        run: |
          javac --release 11 -nowarn \
            -cp "out/gen:$JAR" \
            -d out/classes \
            src/com/brycestrosoft/liber80211/*.java

      - name: Convert to Dalvik bytecode
        run: |
          (cd out && jar cf classes.jar -C classes .)
          "$BT/d8" --min-api 23 --lib "$JAR" --output out out/classes.jar
          ls -la out/classes.dex

      - name: Assemble, align and sign
        run: |
          cp out/base.apk out/app.apk
          (cd out && jar uf app.apk classes.dex)
          "$BT/zipalign" -f -p 4 out/app.apk out/aligned.apk
          keytool -genkeypair -v -keystore out/debug.keystore -storetype PKCS12 \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"
          "$BT/apksigner" sign --ks out/debug.keystore --ks-key-alias androiddebugkey \
            --ks-pass pass:android --key-pass pass:android \
            --out wraith.apk out/aligned.apk

      - name: Verify APK
        run: |
          "$BT/apksigner" verify --print-certs wraith.apk | head -5
          unzip -l wraith.apk | head -15

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wraith-apk
          path: wraith.apk
          retention-days: 30
