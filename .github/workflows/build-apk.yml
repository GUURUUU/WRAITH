name: Build liber80211 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android build tools + platform-tools
        run: |
          mkdir -p $HOME/android-sdk
          cd $HOME/android-sdk
          wget -q https://dl.google.com/android/repository/build-tools_r33.0.2-linux.zip -O bt.zip
          unzip -q bt.zip
          wget -q https://dl.google.com/android/repository/platform-tools-latest-linux.zip -O pt.zip
          unzip -q pt.zip
          BT=$(dirname $(find $HOME/android-sdk -name aapt -type f | head -1))
          echo "BT=$BT" >> $GITHUB_ENV
          echo "PT=$HOME/android-sdk/platform-tools" >> $GITHUB_ENV
          echo "BT found: $BT"
          ls -la $BT/d8 $BT/dx 2>/dev/null || true

      - name: Get android.jar (try platform zip, fall back to Maven)
        run: |
          wget -q https://dl.google.com/android/repository/android-23_r02.zip -O /tmp/platform.zip || true
          if [ -s /tmp/platform.zip ]; then
            (cd $HOME/android-sdk && unzip -o -q /tmp/platform.zip) || true
          fi
          ANDROID_JAR=$(find $HOME/android-sdk -name "android.jar" | head -1)
          if [ -z "$ANDROID_JAR" ]; then
            echo "no android.jar in SDK, downloading API 16 jar from Maven"
            wget -q https://repo1.maven.org/maven2/com/google/android/android/4.1.1.4/android-4.1.1.4.jar -O /tmp/android.jar
            ANDROID_JAR=/tmp/android.jar
          fi
          echo "ANDROID_JAR=$ANDROID_JAR" >> $GITHUB_ENV
          echo "using: $ANDROID_JAR"

      - name: Compile resources and package base APK (aapt v1)
        run: |
          mkdir -p out/gen
          $BT/aapt package -f \
            -M AndroidManifest.xml \
            -S res \
            -I $ANDROID_JAR \
            -J out/gen \
            -F base.apk
          mkdir -p out/gen/com/brycestrosoft/liber80211
          [ -f out/gen/R.java ] && mv out/gen/R.java out/gen/com/brycestrosoft/liber80211/R.java || true
          ls -la base.apk
          find out/gen -name R.java

      - name: Compile Java sources
        run: |
          mkdir -p out/classes
          javac -source 8 -target 8 -cp "out/gen:$ANDROID_JAR" -d out/classes src/com/brycestrosoft/liber80211/*.java

      - name: Convert to Dalvik bytecode (d8 via jar)
        run: |
          jar cf classes.jar -C out/classes .
          ls -la classes.jar
          $BT/d8 classes.jar
          ls -la *.dex

      - name: Add classes.dex to base APK
        run: |
          zip -q base.apk classes.dex

      - name: Align APK
        run: |
          $PT/zipalign -p 4 base.apk app-aligned.apk

      - name: Create debug keystore and sign APK
        run: |
          keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          $BT/apksigner sign --ks debug.keystore --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out liber80211.apk app-aligned.apk

      - name: Verify APK
        run: |
          $BT/apksigner verify --print-certs liber80211.apk | head -5
          unzip -l liber80211.apk | head -15

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: liber80211-apk
          path: liber80211.apk
          retention-days: 30